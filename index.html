<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policies</title>
  <meta name="description" content="Privacy policies for all published applications." />
  <style>
    :root { --bg:#0B1120; --surface:#141B2E; --divider:#23304D; --text:#E8EEF9; --muted:#94A3B8; --accent:#2DD4BF; --blue:#60A5FA; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif; line-height:1.6; }
    .wrap { max-width:760px; margin:0 auto; padding:56px 22px 80px; }
    h1 { font-size:30px; margin:0 0 6px; letter-spacing:-.5px; }
    .sub { color:var(--muted); font-size:15px; margin:0 0 30px; }
    a.card { display:flex; align-items:center; gap:16px; text-decoration:none; color:inherit;
      background:var(--surface); border:1px solid var(--divider); border-radius:16px;
      padding:18px 20px; margin-bottom:14px; transition:border-color .15s; }
    a.card:hover { border-color:var(--accent); }
    .mark { width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg,var(--accent),var(--blue));
      display:flex; align-items:center; justify-content:center; color:var(--bg); font-weight:800; font-size:17px; flex:0 0 auto; }
    .name { font-weight:700; font-size:16px; }
    .desc { color:var(--muted); font-size:13px; margin-top:2px; }
    .chev { margin-left:auto; color:var(--muted); }
    footer { margin-top:40px; padding-top:18px; border-top:1px solid var(--divider); color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Privacy Policies</h1>
    <p class="sub">Privacy policies for all published applications.</p>
    <a class="card" href="./netcarve/">
      <span class="mark">N</span>
      <span>
        <span class="name">NetCarve</span>
        <span class="desc">Subnet &amp; CIDR Calculator &middot; Across Cloud LLC</span>
      </span>
      <span class="chev">&rsaquo;</span>
    </a>
    <footer>&copy; 2026. All applications are free, ad-free, and collect no personal data.</footer>
  </div>
</body>
</html>
